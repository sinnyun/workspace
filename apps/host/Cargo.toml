[package]
name = "fm-host"
description = "Tauri v2 host shell: wires fm-kernel (capabilities + cordis-rs kernel) to the WebView via the event bridge, capability commands, and plugin:// serving"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "fm_host_lib"
path = "src/lib.rs"

[[bin]]
name = "fm-host"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
fm-contracts = { workspace = true }
fm-kernel = { workspace = true }

cordis-core = { workspace = true }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }
http = { workspace = true }

# tauri
tauri = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }

[lints.rust]
missing_docs = "warn"
