[workspace]
resolver = "2"
members = [
    "core-shared/contracts",
    "core-shared/kernel",
    "apps/host",
    "spikes/cordis-boot",
    "plugins/plugin-file-history/backend",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# cordis-rs runtime (Cordis v3, native Rust)
cordis-core = "0.6"
cordis-loader = "0.6"
cordis-timer = "0.6"

# async / util
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time", "fs"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# capability implementations (isolated inside apps/host/src/capabilities — docs/06 §5)
blake3 = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "7"
notify-debouncer-full = "0.4"
parking_lot = "0.12"
# Text encoding detection + decoding for `fs.readText` (roadmap P7-19). This is
# the pair Firefox ships, so GBK/Shift-JIS/windows-1252 are somebody else's
# tables rather than a heuristic written here.
chardetng = "0.1"
encoding_rs = "0.8"
# Windows Shell thumbnails (`shell.thumbnail.read`, docs/plugin-functional/
# plugin-windows-thumbnails.md). `windows` 0.62 is already resolved in Cargo.lock
# by the tauri tree, so reusing it adds no second copy of the bindings.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    # `IFileOperation` and the `IFileDialog` family are described under
    # Shell.Common in the metadata, separate from `Win32_UI_Shell` itself.
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    # `ShellExecuteExW`/`SHELLEXECUTEINFOW` are metadata-gated under this feature
    # (they carry an `HKEY` field); `shell.openPath`/`shell.revealItemInDir` are
    # the users. Proven by compilation, not guessed.
    "Win32_System_Registry",
] }
# The `#[implement]` macro expands into `windows_core::…` paths, so a COM sink
# (IFileOperationProgressSink) needs the core crate visible as a direct dependency.
windows-core = "0.62"
# PNG encoding of the Shell-returned bitmap (transport serialisation only — the
# app never decodes or downscales the original file).
png = "0.18"
base64 = "0.22"
# natural (1 < 2 < 10) case-insensitive name ordering for directory listings
natord = "1"

# tauri host
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
http = "1"

# internal crates
fm-contracts = { path = "core-shared/contracts" }
fm-kernel = { path = "core-shared/kernel" }
plugin-file-history-backend = { path = "plugins/plugin-file-history/backend" }
