[package]
name = "fm-kernel"
description = "Backend core: cordis-rs kernel bootstrap, atomic capability implementations, and the static backend plugin registry (Tauri-free, headlessly testable)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "fm_kernel"
path = "src/lib.rs"

[dependencies]
fm-contracts = { workspace = true }
plugin-file-history-backend = { workspace = true }

cordis-core = { workspace = true }

tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }

# capability implementations (isolated here — docs/06 §5)
blake3 = { workspace = true }
sha2 = { workspace = true }
rusqlite = { workspace = true }
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
natord = { workspace = true }
chardetng = { workspace = true }
encoding_rs = { workspace = true }

# Windows-only host APIs: the Shell thumbnail provider is the sole user (docs/06 §5).
# Kept behind cfg(windows) so a non-Windows build never links shell32/thumbcache and
# never pulls an image codec — the app has no decoder of its own any more.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
windows-core = { workspace = true }
png = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "fs"] }
tempfile = "3"

[lints.rust]
missing_docs = "warn"
