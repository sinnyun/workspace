[package]
name = "fm-kernel"
description = "Backend core: cordis-rs kernel bootstrap, atomic capability implementations, and the static backend plugin registry (Tauri-free, headlessly testable)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "fm_kernel"
path = "src/lib.rs"

[dependencies]
fm-contracts = { workspace = true }
plugin-file-history-backend = { workspace = true }

cordis-core = { workspace = true }

tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }

# capability implementations (isolated here — docs/06 §5)
blake3 = { workspace = true }
sha2 = { workspace = true }
rusqlite = { workspace = true }
notify = { workspace = true }
notify-debouncer-full = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "fs"] }
tempfile = "3"

[lints.rust]
missing_docs = "warn"
